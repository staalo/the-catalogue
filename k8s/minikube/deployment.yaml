apiVersion: apps/v1
kind: Deployment
metadata:
  name: catalogue
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: catalogue
  template:
    metadata:
      labels:
        app.kubernetes.io/name: catalogue
    spec:
      securityContext:
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
      containers:
        - name: catalogue
          image: catalogue:local
          imagePullPolicy: Never
          ports:
            - name: http
              containerPort: 3000
          env:
            - name: NODE_ENV
              value: production
            - name: PORT
              value: "3000"
            - name: DATABASE_URL
              value: /data/catalog.db
            - name: PUBLIC_DIR
              value: /app/public
            - name: MOVIES_PATH
              value: /media/movies
            - name: TV_PATH
              value: /media/tv
            - name: CHOKIDAR_USEPOLLING
              value: "true"
            - name: SESSION_SECRET
              valueFrom:
                secretKeyRef:
                  name: catalogue-secrets
                  key: SESSION_SECRET
            - name: TMDB_API_KEY
              valueFrom:
                secretKeyRef:
                  name: catalogue-secrets
                  key: TMDB_API_KEY
                  optional: true
          volumeMounts:
            - name: data
              mountPath: /data
            - name: movies
              mountPath: /media/movies
              readOnly: true
            - name: tv
              mountPath: /media/tv
              readOnly: true
          startupProbe:
            httpGet:
              path: /ping
              port: http
            failureThreshold: 30
            periodSeconds: 2
          readinessProbe:
            httpGet:
              path: /ping
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /ping
              port: http
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 1Gi
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: catalogue-data
        - name: movies
          hostPath:
            path: /mnt/catalogue-movies
            type: Directory
        - name: tv
          emptyDir: {}
